<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yu-Gi-Oh! Collection</title>
    <!--
      No card count in any of this copy. The collection grows every time the
      pipeline runs, and a number here would go stale without anything failing.
    -->
    <meta name="description" content="A personal Yu-Gi-Oh! card collection, browsable by type, attribute, rarity, summon type and set, with the real card art and frame colours.">
    <!--
      The canonical URL is the Pages one. Without it, the same page served from
      a fork's Pages site or from a preview host competes with this one in an
      index, and neither wins outright.
    -->
    <link rel="canonical" href="https://techcabana.github.io/yugioh-card-collection/">
    <!-- Matches --bg in tokens.css, so mobile browser chrome joins the page. -->
    <meta name="theme-color" content="#0b0b0d">

    <!--
      Link preview. og:image must be absolute — a relative path resolves
      against the scraper, not the page, so every platform silently drops it.
      Regenerate the image with `node scripts/make-icons.mjs`.
    -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Yu-Gi-Oh! Collection">
    <meta property="og:title" content="Yu-Gi-Oh! Collection">
    <meta property="og:description" content="A personal Yu-Gi-Oh! card collection, browsable by type, attribute, rarity, summon type and set.">
    <meta property="og:url" content="https://techcabana.github.io/yugioh-card-collection/">
    <meta property="og:image" content="https://techcabana.github.io/yugioh-card-collection/assets/icons/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="A gold card silhouette on a near-black ground, under a band of the ten Yu-Gi-Oh! card-frame colours.">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Yu-Gi-Oh! Collection">
    <meta name="twitter:description" content="A personal Yu-Gi-Oh! card collection, browsable by type, attribute, rarity, summon type and set.">
    <meta name="twitter:image" content="https://techcabana.github.io/yugioh-card-collection/assets/icons/og-image.png">

    <!--
      SVG first: any browser that understands it scales one file to every size.
      The PNG and the ICO are the fallback, and apple-touch-icon is what iOS
      uses when the site is added to a home screen.
    -->
    <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="icon" href="assets/icons/favicon.ico" sizes="32x32">
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
    <!--
      Preloaded because the @font-face that asks for it sits inside styles.css:
      without this the browser cannot discover the font until the stylesheet has
      downloaded and parsed, which is a whole round trip of fallback text.
      crossorigin is required even same-origin — fonts are fetched in CORS mode,
      and omitting it fetches the file a second time.
    -->
    <link rel="preload" href="assets/fonts/instrument-sans-latin-var.woff2" as="font" type="font/woff2" crossorigin>
    <!-- Tokens first: styles.css resolves every colour, radius and space through them. -->
    <link rel="stylesheet" href="assets/css/tokens.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!--
      First focusable thing on the page. Every visit starts on the same long
      run of filters and pills, so a keyboard user otherwise tabs through all
      of them before reaching a single card. Visible only when focused — see
      .skip-link in styles.css.
    -->
    <a class="skip-link" href="#mainContent">Skip to the collection</a>

    <header class="header">
        <h1>My Yu-Gi-Oh! Collection</h1>
        <!--
          aria-live on the visible count only. Filtering changes it on every
          keystroke, and without this the page silently reflows for a screen
          reader user. The total is not live: it changes once, at load.
        -->
        <div class="stats">
            <div class="stat-item"><span id="totalCardsCount">—</span> Cards</div>
            <div class="stat-item" aria-live="polite"><span id="visibleCardsCount">—</span> Visible</div>
        </div>
    </header>

    <!--
      <search> is the landmark for exactly this: a group of controls that
      filters a set. It carries an implicit search role, so the pills and the
      view toggle are reachable as one region rather than as loose buttons.
    -->
    <search class="controls" aria-label="Filter the collection">
        <div class="search-box">
            <!--
              A placeholder is not a label: it vanishes the moment anything is
              typed, and it is not reliably announced as the field's name.
            -->
            <label class="visually-hidden" for="searchInput">Search the collection</label>
            <input type="text" id="searchInput" placeholder="Search by name, type, or serial…">
        </div>

        <!--
          The facet buttons are built from FACETS in assets/js/facets.js once
          the collection loads, because their values and counts come from the
          data. The fixed pills they replace filtered on card type, which 126
          of 128 cards share.

          The view buttons below are toggles, so they carry aria-pressed rather
          than relying on a class a screen reader cannot see. script.js keeps
          the two in step through setToggleState().
        -->
        <div class="facet-bar" id="facetBar"></div>

        <!--
          Sort. A native <select> rather than a custom menu: this is a
          one-of-many choice, and the platform control already has the keyboard
          behaviour, the mobile picker and the screen-reader support that a
          hand-rolled listbox has to reimplement and usually gets wrong.

          The options are built from SORT_FIELDS in assets/js/sort.js so the
          menu and the comparison rules cannot name different fields.
        -->
        <div class="sort">
            <label class="visually-hidden" for="sortSelect">Sort the collection</label>
            <select class="sort-select" id="sortSelect"></select>
        </div>

        <button class="clear-btn" type="button" id="clearFilters" hidden>Clear filters</button>

        <!--
          Re-fetches the deployed data/cards.json. It does not talk to Airtable
          — a static page has nowhere safe to keep a token (§3 of CLAUDE.md) —
          so what it picks up is whatever the last pipeline run deployed.

          The label beside it is the time of the last fetch, not of the last
          Airtable write: cards.json carries no timestamp, and claiming to know
          when the data changed would be a guess.
        -->
        <div class="refresh">
            <button class="refresh-btn" type="button" id="refreshBtn">Refresh</button>
            <span class="refresh-stamp" id="refreshStamp" aria-live="polite"></span>
        </div>

        <!--
          Density. Grid only, so script.js hides the group while the showcase
          is on screen rather than leaving two buttons that do nothing.

          role="group" with a name, because "Comfortable" and "Compact" mean
          nothing announced on their own — the same reason the chips carry a
          label naming the facet they came from.
        -->
        <div class="density-toggle" id="densityToggle" role="group" aria-label="Grid density">
            <button class="density-btn active" type="button" data-density="comfortable" aria-pressed="true">Comfortable</button>
            <button class="density-btn" type="button" data-density="compact" aria-pressed="false">Compact</button>
        </div>

        <!--
          The grid is the default and is listed first. The carousel is a
          showcase: one card at a time in a stage most of a viewport tall,
          which is a way to admire a card rather than a way to find one.

          data-view="carousel" is unchanged — it is the identifier the code and
          the URL both use, and only the label the user reads has moved.
        -->
        <div class="view-toggle">
            <button class="view-btn active" type="button" data-view="grid" aria-pressed="true">Grid</button>
            <button class="view-btn" type="button" data-view="carousel" aria-pressed="false">Showcase</button>
        </div>
    </search>

    <!--
      Active filters, one removable chip each. Outside <search> because it
      reports the current state rather than offering a control, and live so
      that adding or removing a filter is announced.

      Hidden until something is selected: an empty tray would be a permanent
      band of nothing between the toolbar and the cards.
    -->
    <div class="chip-tray" id="chipTray" aria-live="polite" aria-label="Active filters" hidden></div>

    <!--
      Both views live inside one <main> so the skip link has a single target
      and the landmark does not change when the view does.
    -->
    <main id="mainContent">
        <!--
          role="status" carries an implicit aria-live="polite". It is on the
          element in the served HTML rather than added when the message
          changes, because a live region has to exist before its content
          changes to be announced reliably.
        -->
        <div class="status-message" id="statusMessage" role="status">Loading collection…</div>

        <!-- Carousel View. Hidden until the collection resolves; see applyViewVisibility(). -->
        <div class="carousel-view" id="carouselView" hidden>
            <h2 class="visually-hidden">Collection, showcase view</h2>

            <div class="carousel-container">
                <!--
                  A <ul> for the same reason the grid is one: it is a list of
                  cards, and the count is the useful part. The carousel shows a
                  five-card window rather than the whole collection, so the
                  heading above names the view and the list carries the window.
                -->
                <ul class="carousel-stage" id="carouselStage">
                    <!-- Cards will be injected here -->
                </ul>

                <!--
                  The glyphs are read out by name — "single left-pointing angle
                  quotation mark" — so each button states its purpose instead.
                -->
                <nav class="carousel-controls" aria-label="Carousel">
                    <button class="nav-btn" type="button" id="prevBtn" aria-label="Previous card">‹</button>
                    <div class="card-counter">
                        <span class="current" id="currentCard">1</span> / <span id="totalCardsCarousel">12</span>
                    </div>
                    <button class="nav-btn" type="button" id="nextBtn" aria-label="Next card">›</button>
                </nav>
            </div>
        </div>

        <!-- Grid View. Hidden until the collection resolves; see applyViewVisibility(). -->
        <div class="grid-view" id="gridView" hidden>
            <h2 class="visually-hidden">Collection, grid view</h2>

            <ul class="card-grid" id="cardGrid">
                <!-- Cards will be injected here -->
            </ul>

            <nav class="pagination" aria-label="Pagination">
                <button class="page-btn" type="button" id="prevPage" aria-label="Previous page">‹</button>
                <div class="page-info" aria-live="polite">
                    Page <span id="currentPage">1</span> of <span id="totalPages">1</span>
                </div>
                <button class="page-btn" type="button" id="nextPage" aria-label="Next page">›</button>
            </nav>
        </div>
    </main>

    <!--
      Card detail, opened from a grid card.

      A native <dialog> driven by showModal(), not a div with a class on it.
      The platform gives the focus trap, Escape, the inert background, the
      backdrop and the return of focus to whatever opened it — five things a
      hand-rolled overlay has to reimplement, and the list of overlays on the
      web that get all five right is short.

      The title is visually hidden and static: the card's own name is rendered
      as the <h3> inside, so a visible "Dark Magician" heading above it would
      be a screen reader announcing the same name twice. It still exists,
      because the dialog needs an accessible name and the outline should not
      jump from the h1 to an h3.
    -->
    <dialog class="card-dialog" id="cardDialog" aria-labelledby="cardDialogTitle">
        <div class="card-dialog-head">
            <h2 class="visually-hidden" id="cardDialogTitle">Card details</h2>
            <button class="dialog-close" type="button" id="cardDialogClose" aria-label="Close card details">×</button>
        </div>
        <div class="card-dialog-body" id="cardDialogBody"></div>
    </dialog>

    <script type="module" src="script.js"></script>
</body>
</html>
