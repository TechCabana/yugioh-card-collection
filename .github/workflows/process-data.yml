name: Process Data

# The whole data path in one run: enrich Airtable from YGOPRODeck, regenerate
# data/cards.json, commit, and let the push to main trigger the Pages deploy.
#
# Replaces the earlier sync-only workflow. Two workflows both committing
# data/cards.json to main would eventually race each other.

on:
  # Manual only. This is what the `/getyugidata` chat trigger calls, and what you
  # run yourself after adding rows to Airtable. No schedule — a daily poll
  # burns Airtable API credits with no new rows to justify it.
  workflow_dispatch:

# Shares the "pages" group with pages.yml because this workflow now deploys
# Pages itself. Two concurrent deploys would fight; GitHub also rejects
# overlapping Pages deployments.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: write   # commit data/cards.json
  pages: write      # deploy the site
  id-token: write   # OIDC token deploy-pages requires

jobs:
  process:
    runs-on: ubuntu-latest
    # Mirrors pages.yml's job exactly (see the Prepare/Set up/Upload/Deploy
    # steps below). Both id-token: write and this environment binding are
    # what the Pages OIDC deployment token is scoped against; omitting it
    # here while pages.yml keeps it would be exactly the kind of drift that
    # makes the two workflows deploy different sites.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # Kept in step with ci.yml so the pipeline scripts run on the same
          # Node the tests were green on.
          node-version: '24'

      # A blocked row must not stop the other rows reaching the site, so this
      # is allowed to fail. The job still goes red at the end — see the last
      # step — so a missing select option gets noticed rather than swallowed.
      - name: Enrich Airtable from YGOPRODeck
        id: enrich
        continue-on-error: true
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_TABLE_ID: ${{ secrets.AIRTABLE_TABLE_ID }}
        run: node scripts/enrich-airtable.mjs

      - name: Sync Airtable into data/cards.json
        id: sync
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_TABLE_ID: ${{ secrets.AIRTABLE_TABLE_ID }}
        run: node scripts/sync-airtable.mjs

      # Runs after the sync so it sees the passcodes of any newly added rows.
      # Incremental: a passcode whose file is already committed is never
      # re-fetched, so a normal run downloads nothing. Allowed to fail because
      # a dead image must not hold back the card data that did sync.
      - name: Mirror card art from YGOPRODeck
        id: mirror
        continue-on-error: true
        run: node scripts/mirror-images.mjs

      - name: Verify the result still loads
        # A structurally wrong file would break the live site, so validate
        # before committing rather than after.
        run: |
          node -e "
            const cards = JSON.parse(require('fs').readFileSync('data/cards.json','utf8'));
            if (!Array.isArray(cards)) throw new Error('cards.json is not an array');
            if (cards.length === 0) throw new Error('cards.json is empty');
            const bad = cards.filter(c => !c.name || !c.type || !c.rarity);
            if (bad.length) throw new Error(bad.length + ' card(s) missing required fields');
            const leaked = cards.filter(c =>
              Object.keys(c).some(k => ['quantity','condition','set price','setprice'].includes(k.toLowerCase()))
            );
            if (leaked.length) throw new Error('private field leaked into published data');
            console.log('Validated ' + cards.length + ' card(s).');
          "

      - name: Commit if changed
        id: commit
        # assets/cards/ is committed alongside the data so the two never split
        # into separate commits -- no window where cards.json references art
        # that has not even been pushed yet. Not a guarantee every image
        # exists: the mirror step above is continue-on-error, so a card whose
        # download failed still ships with a path that 404s until the next
        # run retries it. render.js's onerror handler covers that case
        # client-side by dropping the broken <img> back to the placeholder.
        run: |
          if [ -z "$(git status --porcelain data/cards.json assets/cards)" ]; then
            echo "No change to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cards.json assets/cards
          git commit -m "chore: sync collection from Airtable"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # This workflow deploys Pages itself rather than relying on the push
      # above to wake pages.yml.
      #
      # GitHub deliberately does not let a push made with GITHUB_TOKEN trigger
      # further workflow runs — a recursion guard. So the commit lands and
      # pages.yml, which listens on push to main, never fires. Before this,
      # the daily sweep would enrich, commit, and never publish: green runs
      # and a stale site, with no signal anything was wrong.
      #
      # The concurrency: pages group below stops this racing pages.yml when a
      # human push happens at the same time.

      - name: Prepare site directory
        if: steps.commit.outputs.changed == 'true'
        # Mirrors the same step in pages.yml. Copies only what is actually
        # served, so node_modules/, tests/, scripts/, .github/ and repo
        # metadata never reach the deployed artifact.
        run: |
          mkdir _site
          cp index.html 404.html styles.css script.js .nojekyll _site/
          cp -r assets _site/assets
          cp -r data _site/data

      - name: Set up Pages
        if: steps.commit.outputs.changed == 'true'
        uses: actions/configure-pages@v6

      # Matched pair with deploy-pages below — see the same note in pages.yml.
      - name: Upload artifact
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v5

      # Deliberately last. The good rows have already been synced, committed
      # and deployed by this point; this only makes the run visibly red.
      #
      # always() is required here now that four more steps (Prepare site
      # directory through Deploy to GitHub Pages) run between enrich and this
      # step: without it, a plain `if: steps.enrich.outcome == 'failure'` is
      # implicitly ANDed with success(), so a deploy-step failure would skip
      # this step and swallow the diagnostic — the job would still go red, but
      # for the wrong, less actionable reason.
      #
      # The step name and the message both come from the reports the enrich and
      # sync steps wrote, rather than a fixed string. This step used to be
      # called "Fail if any row was blocked" and always printed the
      # missing-select-option text, so a run whose only problem was an
      # unresolvable serial sent the owner looking for a blank Airtable field
      # that was never the cause.
      #
      # SYNC_OUTCOME lets the script tell "sync ran clean" from "sync died
      # before it could write which rows it dropped" (missing secret, network
      # failure) — otherwise a hard sync failure prints "Pipeline clean" here
      # while the job fails for a reason this step never names.
      - name: Report blocked, skipped and dropped rows
        if: always()
        env:
          ENRICH_OUTCOME: ${{ steps.enrich.outcome }}
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
        run: node scripts/pipeline-report.mjs

      # Separate from the step above so the two causes stay distinguishable in
      # the run summary. A warning rather than a failure: a card missing its art
      # still renders its placeholder and all of its data, so this is worth
      # noticing without turning a good sync red.
      - name: Warn if any image could not be mirrored
        if: always() && steps.mirror.outcome == 'failure'
        run: echo "::warning::Card art mirroring hit an error. Affected cards fall back to a type-coloured placeholder. Check the Mirror step's log for the passcode and reason."
